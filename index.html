<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CollisionLab | Laboratorio visual de colisiones</title>
  <meta name="description" content="Laboratorio interactivo para entender cómo detectan choques los motores de videojuegos: círculos, cajas AABB, teorema SAT, detección continua CCD y particionamiento espacial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <div id="canvas-wrapper">
      <canvas id="collision-canvas" width="1280" height="720"></canvas>
    </div>

    <!-- Barra de utilidades flotante para interacción táctil o rápida -->
    <div id="touch-controls" class="floating-toolbar" role="toolbar" aria-label="Controles rápidos">
      <button id="btn-hitbox" class="tool-btn" title="Alternar hitboxes (H)">
        <span class="btn-icon">▢</span>
        <span class="btn-label">Límites [H]</span>
      </button>
      <button id="btn-rays" class="tool-btn" title="Alternar rayos y proyecciones (X)">
        <span class="btn-icon">↗</span>
        <span class="btn-label">Rayos [X]</span>
      </button>
      <button id="btn-toggle-mode" class="tool-btn" title="Alternar modo de escena (TAB)">
        <span class="btn-icon">⇄</span>
        <span class="btn-label">Modo [TAB]</span>
      </button>
      <button id="btn-reset" class="tool-btn" title="Reiniciar escena (R)">
        <span class="btn-icon">↺</span>
        <span class="btn-label">Reiniciar [R]</span>
      </button>
      <button id="btn-fullscreen" class="tool-btn" title="Pantalla completa (F)">
        <span class="btn-icon">⛶</span>
        <span class="btn-label">Pantalla [F]</span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
